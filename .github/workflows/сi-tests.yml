name: 1. CI - Code Quality (Backend)
on:
  push:
    branches: ["develop"]
    paths:
      - 'BackendSpring/**'

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 20
        uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Style (Checkstyle)
        working-directory: ./BackendSpring
        run: mvn checkstyle:check
        continue-on-error: true

      - name: Static Code Analysis
        working-directory: ./BackendSpring
        run: mvn pmd:check spotbugs:check
        continue-on-error: true

      - name: Compile Code (No Tests Execution)
        working-directory: ./BackendSpring
        run: mvn clean test-compile

      - name: Dependency Vulnerability Check
        working-directory: ./BackendSpring
        run: mvn org.owasp:dependency-check-maven:check
        continue-on-error: true

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-ci-reports
          path: |
            BackendSpring/target/dependency-check-report.html
          retention-days: 7